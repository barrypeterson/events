version: '3.9'

services:
  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: slo-events-postgres
    ports:
      - '6432:5432'
    environment:
      POSTGRES_USER: sloevents
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: sloevents
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sloevents']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slo-events-network

  # Redis for caching and job queues
  redis:
    image: redis:7-alpine
    container_name: slo-events-redis
    ports:
      - '6381:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - slo-events-network

  # Redis Commander for Redis GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: slo-events-redis-commander
    ports:
      - '6081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - slo-events-network

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: slo-events-mailhog
    ports:
      - '6025:1025' # SMTP server
      - '6026:8025' # Web UI
    networks:
      - slo-events-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  slo-events-network:
    driver: bridge
